<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas','SFMono-Regular',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#0d1a12"/>
      <stop offset="55%" stop-color="#070b10"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1712"/>
      <stop offset="100%" stop-color="#080c0a"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.18"/>
    </pattern>

    <clipPath id="termClip">
      <rect x="40" y="60" width="820" height="460" rx="14"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="560" fill="url(#bgGlow)"/>

  <!-- decorative matrix rain columns (kept subtle, outside the readable text) -->
  <g fill="#1fae63" font-size="13" opacity="0.35">
    <text x="10" y="-40">01<animate attributeName="y" values="-40;600" dur="7s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="7s" begin="-1s" repeatCount="indefinite"/></text>
    <text x="22" y="-80">10<animate attributeName="y" values="-80;600" dur="9s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="9s" begin="-3s" repeatCount="indefinite"/></text>
    <text x="864" y="-60">11<animate attributeName="y" values="-60;600" dur="8s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="8s" begin="-2s" repeatCount="indefinite"/></text>
    <text x="878" y="-100">00<animate attributeName="y" values="-100;600" dur="10s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="10s" begin="-5s" repeatCount="indefinite"/></text>
    <text x="4" y="-120">rm -rf<animate attributeName="y" values="-120;600" dur="11s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="11s" begin="-6s" repeatCount="indefinite"/></text>
  </g>

  <!-- glow border behind terminal -->
  <rect x="40" y="60" width="820" height="460" rx="14" fill="none" stroke="#39d98a" stroke-width="4" filter="url(#glow)" opacity="0.5">
    <animate attributeName="stroke" values="#39d98a;#58a6ff;#c084fc;#39d98a" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal window -->
  <rect x="40" y="60" width="820" height="460" rx="14" fill="url(#termGrad)" stroke="#39d98a" stroke-width="1.5">
    <animate attributeName="stroke" values="#39d98a;#58a6ff;#c084fc;#39d98a" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- title bar -->
  <path d="M40,74 a14,14 0 0 1 14,-14 h792 a14,14 0 0 1 14,14 v22 h-820 z" fill="#0c1310"/>
  <circle cx="66" cy="78" r="6" fill="#ff5f56"/>
  <circle cx="88" cy="78" r="6" fill="#ffbd2e"/>
  <circle cx="110" cy="78" r="6" fill="#27c93f"/>
  <text x="450" y="83" text-anchor="middle" fill="#7d8b83" font-size="13">yahya@cybersecurity: ~</text>
  <line x1="40" y1="96" x2="860" y2="96" stroke="#1c2620" stroke-width="1"/>

  <!-- scanline overlay -->
  <rect x="40" y="96" width="820" height="424" clip-path="url(#termClip)" fill="url(#scan)" opacity="0.5"/>

  <!-- terminal content -->
  <g font-size="15" clip-path="url(#termClip)">

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.3s" fill="freeze"/>
      <text x="66" y="130" fill="#7ee787">yahya@cybersecurity:~$ <tspan fill="#e6edf3">whoami</tspan></text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/>
      <text x="66" y="158" fill="#c9d1d9">› yahya — cybersecurity student, professional button-masher</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.3s" fill="freeze"/>
      <text x="66" y="192" fill="#7ee787">yahya@cybersecurity:~$ <tspan fill="#e6edf3">cat about.txt</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.3s" fill="freeze"/>
      <text x="66" y="220" fill="#c9d1d9">› breaking into systems (legally, mostly) so I can learn to</text>
      <text x="66" y="240" fill="#c9d1d9">  lock them back up properly.</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.3s" fill="freeze"/>
      <text x="66" y="274" fill="#7ee787">yahya@cybersecurity:~$ <tspan fill="#e6edf3">ls skills/</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.3s" fill="freeze"/>
      <text x="66" y="302" fill="#58a6ff">python   linux   nmap   burpsuite   wireshark   git   caffeine.exe</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.1s" dur="0.3s" fill="freeze"/>
      <text x="66" y="336" fill="#7ee787">yahya@cybersecurity:~$ <tspan fill="#e6edf3">./status.sh</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.8s" dur="0.3s" fill="freeze"/>
      <text x="66" y="360" fill="#c9d1d9">› [<tspan fill="#7ee787">OK</tspan>] curiosity......... online</text>
      <text x="66" y="380" fill="#c9d1d9">› [<tspan fill="#7ee787">OK</tspan>] motivation........ online</text>
      <text x="66" y="400" fill="#c9d1d9">› [<tspan fill="#ffbd2e">WARN</tspan>] sleep schedule.... not found</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6.9s" dur="0.3s" fill="freeze"/>
      <text x="66" y="434" fill="#7ee787">yahya@cybersecurity:~$ <tspan fill="#e6edf3">open portfolio</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="7.6s" dur="0.3s" fill="freeze"/>
      <text x="66" y="462" fill="#c084fc">› beakportfolio.netlify.app</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="8.5s" dur="0.3s" fill="freeze"/>
      <text x="66" y="496" fill="#7ee787">yahya@cybersecurity:~$ <tspan fill="#e6edf3">_</tspan></text>
    </g>

    <!-- blinking cursor -->
    <rect x="204" y="483" width="9" height="16" fill="#7ee787" opacity="0">
      <animate attributeName="opacity" begin="8.9s" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
