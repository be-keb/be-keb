<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="auto">
  <defs>
    <!-- Font styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;display=swap');
      .term-font {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .text-main { fill: #e2e8f0; font-size: 15px; }
      .text-muted { fill: #8a7a9e; font-size: 14px; }
      .text-header { fill: #a78bfa; font-size: 14px; font-weight: 500; }
      .ascii-art { fill: #4a3b5c; font-size: 14px; line-height: 1.2; white-space: pre; }
      
      /* Blinking cursor animation */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; fill: #a78bfa; }
    </style>
    
    <!-- Striped moon pattern -->
    <clipPath id="moon-clip">
      <circle cx="650" cy="220" r="70" />
    </clipPath>
  </defs>

  <!-- Outer Background (Window Shadow/Border) -->
  <rect width="800" height="500" fill="#2a1b3d" rx="12" ry="12" />
  
  <!-- Terminal Inner Background -->
  <rect x="15" y="15" width="770" height="470" fill="#0d0d12" rx="8" ry="8" stroke="#4a3b5c" stroke-width="2" />

  <!-- Header Section -->
  <text x="35" y="45" class="term-font text-header">$ ~ #</text>
  <text x="400" y="45" class="term-font text-muted" text-anchor="middle">@afia-ava</text>
  <line x1="25" y1="65" x2="775" y2="65" stroke="#4a3b5c" stroke-width="1.5" />

  <!-- ASCII Art: Stars -->
  <g class="term-font ascii-art">
    <text x="100" y="120">.</text>
    <text x="200" y="90">*</text>
    <text x="350" y="110">.</text>
    <text x="450" y="85">.</text>
    <text x="550" y="130">*</text>
    <text x="400" y="170">.</text>
  </g>

  <!-- ASCII Art: Mountains (Dotted Style) -->
  <g class="term-font ascii-art">
    <!-- Mountain 1 (Left) -->
    <text x="150" y="370">.</text>
    <text x="140" y="355">.</text>
    <text x="160" y="355">.</text>
    <text x="130" y="340">.</text>
    <text x="170" y="340">.</text>
    <text x="120" y="325">.</text>
    <text x="180" y="325">.</text>
    <text x="110" y="310">.</text>
    <text x="190" y="310">.</text>
    <text x="100" y="295">.</text>
    <text x="200" y="295">.</text>
    
    <!-- Mountain 2 (Center) -->
    <text x="280" y="280">.</text>
    <text x="270" y="265">.</text>
    <text x="290" y="265">.</text>
    <text x="260" y="250">.</text>
    <text x="300" y="250">.</text>
    <text x="250" y="235">.</text>
    <text x="310" y="235">.</text>
    <text x="240" y="220">.</text>
    <text x="320" y="220">.</text>
    <text x="230" y="205">.</text>
    <text x="330" y="205">.</text>
    <text x="220" y="190">.</text>
    <text x="340" y="190">.</text>
    <text x="210" y="175">.</text>
    <text x="350" y="175">.</text>
    
    <!-- Mountain 3 (Right) -->
    <text x="450" y="320">.</text>
    <text x="440" y="305">.</text>
    <text x="460" y="305">.</text>
    <text x="430" y="290">.</text>
    <text x="470" y="290">.</text>
    <text x="420" y="275">.</text>
    <text x="480" y="275">.</text>
    <text x="410" y="260">.</text>
    <text x="490" y="260">.</text>
    <text x="400" y="245">.</text>
    <text x="500" y="245">.</text>
  </g>

  <!-- Ground Line (Subtle) -->
  <line x1="40" y1="385" x2="760" y2="385" stroke="#2a1b3d" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Striped Moon -->
  <g>
    <!-- Moon Outline -->
    <circle cx="650" cy="220" r="70" fill="none" stroke="#4a3b5c" stroke-width="2" />
    
    <!-- Horizontal Stripes within the Moon -->
    <g clip-path="url(#moon-clip)" stroke="#4a3b5c" stroke-width="2">
      <line x1="560" y1="160" x2="740" y2="160" />
      <line x1="560" y1="175" x2="740" y2="175" />
      <line x1="560" y1="190" x2="740" y2="190" />
      <line x1="560" y1="205" x2="740" y2="205" />
      <line x1="560" y1="220" x2="740" y2="220" />
      <line x1="560" y1="235" x2="740" y2="235" />
      <line x1="560" y1="250" x2="740" y2="250" />
      <line x1="560" y1="265" x2="740" y2="265" />
      <line x1="560" y1="280" x2="740" y2="280" />
    </g>
  </g>

  <!-- Footer Section -->
  <text x="40" y="430" class="term-font text-main">hi! i'm afia. i like to learn and make new things.</text>
  <text x="40" y="465" class="term-font text-main">check out my projects ^^ </text>
  
  <!-- Blinking Cursor -->
  <text x="275" y="465" class="term-font cursor">|</text>

</svg>
