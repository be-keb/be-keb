<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="auto" role="img">

  <defs>
    <clipPath id="moon-clip">
      <circle cx="660" cy="220" r="75" />
    </clipPath>
    
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .star:nth-child(2n) { animation-delay: 1.5s; }
    .star:nth-child(3n) { animation-delay: 0.7s; }

    @keyframes draw-mountain {
      to { stroke-dashoffset: 0; }
    }
    .mountain-path {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: draw-mountain 3s ease-out forwards;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .moon-glow { animation: pulse-glow 4s ease-in-out infinite; transform-origin: 660px 220px; }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { animation: blink 1s step-end infinite; }
  </style>


  <rect width="800" height="500" fill="#16161e" rx="12" ry="12" />

  <rect x="15" y="15" width="770" height="470" fill="#1a1b26" rx="8" ry="8" stroke="#2f3549" stroke-width="2" />
  <circle cx="35" cy="40" r="6" fill="#f7768e" />
  <circle cx="55" cy="40" r="6" fill="#e0af68" />
  <circle cx="75" cy="40" r="6" fill="#9ece6a" />

  <text x="400" y="45" font-family="monospace" font-size="14" fill="#565f89" text-anchor="middle" font-weight="bold">yahya: ~</text>
  <line x1="25" y1="65" x2="775" y2="65" stroke="#2f3549" stroke-width="1.5" />

  <g fill="#7aa2f7">
    <circle class="star" cx="120" cy="110" r="1.5" />
    <circle class="star" cx="250" cy="90" r="2" />
    <circle class="star" cx="350" cy="130" r="1.5" />
    <circle class="star" cx="480" cy="100" r="1.5" />
    <circle class="star" cx="550" cy="150" r="2" />
    <circle class="star" cx="420" cy="180" r="1.5" />
    <circle class="star" cx="180" cy="160" r="1.5" />
  </g>

  <g stroke="#3b4261" stroke-width="3" stroke-linecap="round" stroke-dasharray="0, 10" fill="none">
    <path class="mountain-path" d="M 60 380 L 160 220 L 260 380" style="animation-delay: 0.2s;" />
    <path class="mountain-path" d="M 180 380 L 310 150 L 440 380" style="animation-delay: 0.5s;" />
    <path class="mountain-path" d="M 380 380 L 500 240 L 620 380" style="animation-delay: 0.8s;" />
    <path class="mountain-path" d="M 520 380 L 570 290 L 620 380" style="animation-delay: 1.1s;" />
  </g>

  <line x1="40" y1="385" x2="760" y2="385" stroke="#2f3549" stroke-width="2" stroke-dasharray="5 5" />

  <g>
    <circle class="moon-glow" cx="660" cy="220" r="80" fill="url(#moon-glow)" />
    <circle cx="660" cy="220" r="75" fill="none" stroke="#7aa2f7" stroke-width="2" opacity="0.8" />
    <g clip-path="url(#moon-clip)" stroke="#3b4261" stroke-width="3">
      <line x1="560" y1="150" x2="760" y2="150" />
      <line x1="560" y1="170" x2="760" y2="170" />
      <line x1="560" y1="190" x2="760" y2="190" />
      <line x1="560" y1="210" x2="760" y2="210" />
      <line x1="560" y1="230" x2="760" y2="230" />
      <line x1="560" y1="250" x2="760" y2="250" />
      <line x1="560" y1="270" x2="760" y2="270" />
      <line x1="560" y1="290" x2="760" y2="290" />
    </g>
  </g>

  <text x="35" y="430" font-family="monospace" font-size="15" fill="#a9b1d6">hi! i'm yahya. i build things for the web.</text>
  <text x="35" y="465" font-family="monospace" font-size="15" fill="#a9b1d6">check out my projects below ^^</text>
  
  <rect class="cursor" x="310" y="452" width="2" height="15" fill="#7aa2f7" />
</svg>
