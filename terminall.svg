
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="500"
     viewBox="0 0 800 500"
     role="img">

  <defs>
    <clipPath id="moon-clip">
      <circle cx="660" cy="220" r="75"/>
    </clipPath>

    <radialGradient id="moon-glow">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="#060608"/>
  <rect x="15" y="15" width="770" height="470"
        rx="8" fill="#0b0b0f"
        stroke="#1a1b26" stroke-width="2"/>

  <!-- Terminal controls -->
  <circle cx="35" cy="40" r="6" fill="#db4b4b"/>
  <circle cx="55" cy="40" r="6" fill="#c09938"/>
  <circle cx="75" cy="40" r="6" fill="#7a9e4e"/>

  <text x="400" y="45"
        font-family="monospace" font-size="14"
        fill="#414868" text-anchor="middle"
        font-weight="bold">yahya: ~</text>

  <line x1="25" y1="65" x2="775" y2="65"
        stroke="#1a1b26" stroke-width="1.5"/>

  <!-- Stars -->
  <g fill="#5d7bbd">
    <circle cx="120" cy="110" r="1.5" opacity=".7"/>
    <circle cx="250" cy="90" r="2" opacity=".9"/>
    <circle cx="350" cy="130" r="1.5" opacity=".5"/>
    <circle cx="480" cy="100" r="1.5" opacity=".8"/>
    <circle cx="550" cy="150" r="2" opacity=".6"/>
    <circle cx="420" cy="180" r="1.5" opacity=".9"/>
    <circle cx="180" cy="160" r="1.5" opacity=".6"/>
  </g>

  <!-- Mountains -->
  <g fill="none" stroke="#1f2335"
     stroke-width="3" stroke-linecap="round"
     stroke-dasharray="2 8">

    <path d="M60 380 L160 220 L260 380"/>
    <path d="M180 380 L310 150 L440 380"/>
    <path d="M380 380 L500 240 L620 380"/>
    <path d="M520 380 L570 290 L620 380"/>

  </g>

  <!-- Horizon -->
  <line x1="40" y1="385" x2="760" y2="385"
        stroke="#1a1b26" stroke-width="2"
        stroke-dasharray="5 5"/>

  <!-- Moon -->
  <circle cx="660" cy="220" r="85"
          fill="url(#moon-glow)"/>

  <circle cx="660" cy="220" r="75"
          fill="none" stroke="#5d7bbd"
          stroke-width="2" opacity=".8"/>

  <g clip-path="url(#moon-clip)"
     stroke="#1f2335" stroke-width="3">

    <line x1="560" y1="150" x2="760" y2="150"/>
    <line x1="560" y1="170" x2="760" y2="170"/>
    <line x1="560" y1="190" x2="760" y2="190"/>
    <line x1="560" y1="210" x2="760" y2="210"/>
    <line x1="560" y1="230" x2="760" y2="230"/>
    <line x1="560" y1="250" x2="760" y2="250"/>
    <line x1="560" y1="270" x2="760" y2="270"/>
    <line x1="560" y1="290" x2="760" y2="290"/>

  </g>

  <!-- Terminal text -->
  <text x="35" y="430"
        font-family="monospace" font-size="15"
        fill="#a9b1d6">
    hi! i'm yahya. i build things for the web
  </text>

  <text x="35" y="465"
        font-family="monospace" font-size="15"
        fill="#a9b1d6">
    check out my projects ^^
  </text>

  <!-- Cursor -->
  <rect x="310" y="452" width="2" height="15"
        fill="#7aa2f7"/>

</svg>
